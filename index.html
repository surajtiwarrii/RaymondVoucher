<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raymond Birthday Voucher Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#0d0503;
    --maroon-900:#1a0a08;
    --maroon-800:#2a0f0c;
    --gold-400:#e0be82;
    --gold-500:#c9a25a;
    --gold-600:#a9813e;
    --cream:#f5ece0;
    --ok:#4caf7d;
    --err:#e0665a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #2a120e 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #200d09 0%, transparent 45%),
      var(--maroon-950);
    color:var(--cream);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  header .brand{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:38px;
    color:var(--gold-400);
    letter-spacing:1px;
  }
  header .tag{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold-600);
    margin-top:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:860px){
    .grid{grid-template-columns:1fr;}
  }
  .panel{
    background:linear-gradient(180deg, var(--maroon-900), var(--maroon-800));
    border:1px solid #3a1c15;
    border-radius:14px;
    padding:24px;
  }
  .panel h2{
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    color:var(--gold-400);
    margin:0 0 18px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  label{
    display:block;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold-500);
    margin-bottom:6px;
    font-weight:600;
  }
  .field{margin-bottom:18px;}
  input, select{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #4a2a1f;
    background:#150807;
    color:var(--cream);
    font-family:'Poppins',sans-serif;
    font-size:15px;
    outline:none;
    transition:border-color .15s;
  }
  input::placeholder{color:#7a5c4d;}
  input:focus, select:focus{border-color:var(--gold-500);}
  select{appearance:none;-webkit-appearance:none;background:#150807 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="%23c9a25a" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>') no-repeat right 14px center;}
  .hint{font-size:11.5px;color:#8a6a58;margin-top:5px;}
  .error-msg{font-size:12px;color:var(--err);margin-top:5px;min-height:14px;}
  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:linear-gradient(180deg, var(--gold-400), var(--gold-600));
    color:#241006;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:transform .1s, box-shadow .15s;
  }
  .btn:hover{box-shadow:0 6px 18px rgba(201,162,90,0.35);}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{
    background:transparent;
    border:1px solid var(--gold-600);
    color:var(--gold-400);
    margin-top:10px;
  }
  .btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
  .preview-panel{text-align:center;}
  #voucherCanvas{
    width:100%;
    height:auto;
    border-radius:10px;
    border:1px solid #3a1c15;
    display:block;
  }
  .empty-state{
    display:flex;
    align-items:center;
    justify-content:center;
    aspect-ratio:1672/941;
    border:1px dashed #4a2a1f;
    border-radius:10px;
    color:#7a5c4d;
    font-size:14px;
    text-align:center;
    padding:20px;
  }
  .status{
    font-size:12.5px;
    margin-top:12px;
    color:var(--gold-500);
    min-height:16px;
  }
  .status.ok{color:var(--ok);}

  /* template picker */
  .tpl-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tpl-card{
    border:2px solid #4a2a1f;
    border-radius:10px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    background:#150807;
    transition:border-color .15s;
  }
  .tpl-card img{
    width:100%;
    border-radius:6px;
    display:block;
    margin-bottom:6px;
    background:#000;
  }
  .tpl-card span{font-size:12px;color:var(--gold-500);font-weight:600;}
  .tpl-card.active{border-color:var(--gold-500);box-shadow:0 0 0 1px var(--gold-500) inset;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Raymond</div>
    <div class="tag">Birthday Voucher Generator</div>
  </header>

  <div class="grid">
    <!-- FORM -->
    <div class="panel">
      <h2>Template Choose Karo</h2>
      <div class="field">
        <div class="tpl-options" id="tplOptions">
          <div class="tpl-card active" data-tpl="t1">
            <img src="voucher-template-1.png" alt="Template 1">
            <span>Template 1</span>
          </div>
          <div class="tpl-card" data-tpl="t2">
            <img src="voucher-template-2.png" alt="Template 2">
            <span>Template 2</span>
          </div>
        </div>
      </div>

      <h2>Customer Details</h2>

      <div class="field">
        <label for="storeSelect">Store</label>
        <select id="storeSelect">
          <option value="" disabled selected>Select your store</option>
        </select>
      </div>

      <div class="field">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" placeholder="e.g. Rahul Gupta" maxlength="40">
      </div>

      <div class="field">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" placeholder="10 digit mobile number" maxlength="10" inputmode="numeric">
        <div class="hint">Yeh number hi voucher code ke roop mein print hoga</div>
        <div class="error-msg" id="mobileError"></div>
      </div>

      <div class="field">
        <label for="salesmanName">Salesman Name</label>
        <input type="text" id="salesmanName" placeholder="Aapka naam" maxlength="30">
      </div>

      <button class="btn" id="generateBtn">Generate Voucher</button>
      <button class="btn secondary" id="downloadBtn" disabled>Download Voucher</button>
      <div class="status" id="statusMsg"></div>
    </div>

    <!-- PREVIEW -->
    <div class="panel preview-panel">
      <h2>Preview</h2>
      <div id="emptyState" class="empty-state">
        Form bharo aur "Generate Voucher" dabao —<br>voucher yahan preview hoga
      </div>
      <canvas id="voucherCanvas" width="1535" height="1024" style="display:none;"></canvas>
    </div>
  </div>
</div>

<script>
// =====================================================================
// Store master data: har store ka naam + address (2 hisso mein, taaki
// dono template me sahi tarah fit ho jaaye)
// =====================================================================
const STORES = [
  { name: "Maldahiya",   line1: "Maldahiya, Varanasi,",   line2: "Uttar Pradesh" },
  { name: "Pahariya",    line1: "Pahariya, Varanasi,",    line2: "Uttar Pradesh" },
  { name: "Mughalsarai", line1: "Mughalsarai, Chandauli,",line2: "Uttar Pradesh" },
  { name: "Mirzapur",    line1: "Mirzapur,",              line2: "Uttar Pradesh" },
  { name: "Jaunpur",     line1: "Jaunpur,",               line2: "Uttar Pradesh" },
  { name: "Sultanpur",   line1: "Sultanpur,",             line2: "Uttar Pradesh" }
];

// =====================================================================
// Template coordinate maps — in dhyan se image ke actual pixels se
// naapa gaya hai (mask box + text baseline position), taaki naya text
// template ke purane placeholder text ("XXXXXXXXXXX" / "SALESMAN NAME" /
// address) ke UPAR clean overwrite ho, overlap na kare.
// =====================================================================
const TEMPLATES = {
  t1: {
    file: 'voucher-template-1.png',
    width: 1535,
    height: 1024,
    maskColor: '#0f0201',
    fields: {
      name:     { maskX: 595, maskY: 645, maskW: 300, maskH: 32, textX: 605, textY: 667, maxWidth: 280, baseSize: 26, color: '#ffffff', align: 'left' },
      mobile:   { maskX: 595, maskY: 693, maskW: 300, maskH: 32, textX: 605, textY: 715, maxWidth: 280, baseSize: 24, color: '#ffffff', align: 'left' },
      salesman: { maskX: 595, maskY: 775, maskW: 300, maskH: 32, textX: 605, textY: 797, maxWidth: 280, baseSize: 22, color: '#ffffff', align: 'left' }
    },
    address: {
      type: 'single',
      maskX: 780, maskY: 924, maskW: 345, maskH: 36,
      textX: 790, textY: 950, maxWidth: 335, baseSize: 22, color: '#e2c088', align: 'left'
    }
  },
  t2: {
    file: 'voucher-template-2.png',
    width: 1672,
    height: 941,
    maskColor: '#0a0a0a',
    fields: {
      name:     { maskX: 350, maskY: 518, maskW: 310, maskH: 30, textX: 360, textY: 541, maxWidth: 295, baseSize: 22, color: '#ffffff', align: 'left' },
      mobile:   { maskX: 350, maskY: 561, maskW: 310, maskH: 30, textX: 360, textY: 584, maxWidth: 295, baseSize: 20, color: '#ffffff', align: 'left' },
      salesman: { maskX: 350, maskY: 604, maskW: 310, maskH: 30, textX: 360, textY: 627, maxWidth: 295, baseSize: 20, color: '#ffffff', align: 'left' }
    },
    address: {
      type: 'double',
      maskX: 110, maskY: 788, maskW: 425, maskH: 90,
      centerX: 322, textY1: 810, textY2: 852, maxWidth: 400, baseSize: 21, color: '#f5ece0', align: 'center'
    }
  }
};

let activeTpl = 't1';

const tplCards      = document.querySelectorAll('.tpl-card');
const storeSelect    = document.getElementById('storeSelect');
const customerName  = document.getElementById('customerName');
const mobileNumber  = document.getElementById('mobileNumber');
const salesmanName  = document.getElementById('salesmanName');
const generateBtn   = document.getElementById('generateBtn');
const downloadBtn   = document.getElementById('downloadBtn');
const statusMsg     = document.getElementById('statusMsg');
const mobileError   = document.getElementById('mobileError');
const canvas        = document.getElementById('voucherCanvas');
const emptyState    = document.getElementById('emptyState');
const ctx           = canvas.getContext('2d');

STORES.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.name;
  opt.textContent = s.name;
  storeSelect.appendChild(opt);
});

mobileNumber.addEventListener('input', () => {
  mobileNumber.value = mobileNumber.value.replace(/\D/g, '').slice(0, 10);
});

// ---- Template switch ----
tplCards.forEach(card => {
  card.addEventListener('click', () => {
    tplCards.forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    activeTpl = card.dataset.tpl;
    canvas.style.display = 'none';
    emptyState.style.display = 'flex';
    downloadBtn.disabled = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status';
    loadTemplateImage(activeTpl);
  });
});

// ---- Load template images (both, so switching is instant) ----
const loadedImages = {};
const failedImages = {};

function loadTemplateImage(key) {
  if (loadedImages[key] || failedImages[key]) return;
  const cfg = TEMPLATES[key];
  const img = new Image();
  img.onload = () => { loadedImages[key] = img; };
  img.onerror = () => {
    failedImages[key] = true;
    statusMsg.className = 'status';
    statusMsg.textContent = `Template image "${cfg.file}" nahi mili. Is naam ki image file raymond.html ke SAME folder mein upload karo (Netlify/GitHub par).`;
  };
  img.src = cfg.file;
}
loadTemplateImage('t1');
loadTemplateImage('t2');

function fitText(text, maxWidth, baseSize, fontWeight) {
  let size = baseSize;
  ctx.font = `${fontWeight} ${size}px Poppins, sans-serif`;
  while (ctx.measureText(text).width > maxWidth && size > 12) {
    size -= 1;
    ctx.font = `${fontWeight} ${size}px Poppins, sans-serif`;
  }
  return size;
}

function drawMask(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawField(field, value) {
  drawMask(field.maskX, field.maskY, field.maskW, field.maskH, TEMPLATES[activeTpl].maskColor);
  ctx.fillStyle = field.color;
  ctx.textAlign = field.align;
  const size = fitText(value, field.maxWidth, field.baseSize, '700');
  ctx.font = `700 ${size}px Poppins, sans-serif`;
  ctx.fillText(value, field.textX, field.textY);
}

async function generateVoucher() {
  statusMsg.textContent = '';
  statusMsg.className = 'status';
  mobileError.textContent = '';

  const storeName = storeSelect.value;
  const store = STORES.find(s => s.name === storeName);
  const name = customerName.value.trim();
  const mobile = mobileNumber.value.trim();
  const salesman = salesmanName.value.trim();

  let hasError = false;
  if (!store) { statusMsg.textContent = 'Store select karo.'; hasError = true; }
  if (!name) { statusMsg.textContent = 'Customer ka naam daalo.'; hasError = true; }
  if (mobile.length !== 10) { mobileError.textContent = 'Mobile number 10 digit ka hona chahiye.'; hasError = true; }
  if (!salesman) { statusMsg.textContent = 'Apna naam (salesman) daalo.'; hasError = true; }
  if (hasError) return;

  const cfg = TEMPLATES[activeTpl];

  if (failedImages[activeTpl]) {
    statusMsg.textContent = `Template image nahi mili. "${cfg.file}" naam ki file raymond.html ke saath upload karo.`;
    return;
  }
  if (!loadedImages[activeTpl]) {
    statusMsg.textContent = 'Template load ho raha hai, 1 second ruko...';
    setTimeout(generateVoucher, 300);
    return;
  }

  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }

  canvas.width = cfg.width;
  canvas.height = cfg.height;

  // base template
  ctx.drawImage(loadedImages[activeTpl], 0, 0, canvas.width, canvas.height);
  ctx.textBaseline = 'alphabetic';

  // customer name / mobile / salesman
  drawField(cfg.fields.name, name.toUpperCase());
  drawField(cfg.fields.mobile, mobile);
  drawField(cfg.fields.salesman, salesman.toUpperCase());

  // address
  const addr = cfg.address;
  if (addr.type === 'single') {
    drawMask(addr.maskX, addr.maskY, addr.maskW, addr.maskH, cfg.maskColor);
    ctx.fillStyle = addr.color;
    ctx.textAlign = addr.align;
    const full = `${store.line1} ${store.line2}`;
    const size = fitText(full, addr.maxWidth, addr.baseSize, '600');
    ctx.font = `600 ${size}px Poppins, sans-serif`;
    ctx.fillText(full, addr.textX, addr.textY);
  } else {
    drawMask(addr.maskX, addr.maskY, addr.maskW, addr.maskH, cfg.maskColor);
    ctx.fillStyle = addr.color;
    ctx.textAlign = addr.align;
    const size = fitText(store.line1, addr.maxWidth, addr.baseSize, '600');
    ctx.font = `600 ${size}px Poppins, sans-serif`;
    ctx.fillText(store.line1, addr.centerX, addr.textY1);
    ctx.fillText(store.line2, addr.centerX, addr.textY2);
  }
  ctx.textAlign = 'left';

  canvas.style.display = 'block';
  emptyState.style.display = 'none';
  downloadBtn.disabled = false;
  statusMsg.textContent = 'Voucher ready hai. Download kar lo.';
  statusMsg.className = 'status ok';
}

function downloadVoucher() {
  const name = customerName.value.trim().replace(/\s+/g, '_') || 'Customer';
  const mobile = mobileNumber.value.trim() || 'voucher';
  const filename = `Raymond_Voucher_${name}_${mobile}.png`;

  let toBlobCall;
  try {
    toBlobCall = () => canvas.toBlob(blobCallback, 'image/png');
  } catch (e) { toBlobCall = null; }

  if (!toBlobCall) {
    statusMsg.className = 'status';
    statusMsg.textContent = 'Download fail hua: browser is feature ko support nahi karta.';
    return;
  }

  try {
    toBlobCall();
  } catch (err) {
    // Yeh error tab aata hai jab HTML file ko seedhe double-click karke
    // (file:// address bar mein) khola gaya ho — is se canvas "tainted"
    // ho jata hai aur image export block ho jata hai.
    statusMsg.className = 'status';
    statusMsg.textContent = 'Download fail hua kyunki page file:// se khula hai. Is file ko kisi web server / hosting (GitHub Pages, Netlify) par daal kar http/https link se kholo — tab download kaam karega.';
  }

  async function blobCallback(blob) {
    if (!blob) {
      statusMsg.className = 'status';
      statusMsg.textContent = 'Download fail hua — image ban nahi payi. Page reload karke dobara try karo.';
      return;
    }

    const file = new File([blob], filename, { type: 'image/png' });

    // Mobile browsers (mainly iOS Safari) mein <a download> kaam nahi karta —
    // wahan Web Share API use karo taaki "Save Image" ka option mile.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return;
      } catch (shareErr) {
        if (shareErr && shareErr.name === 'AbortError') return; // user cancelled share sheet
        // agar share fail hua to neeche wale normal download par fallback karo
      }
    }

    try {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (err) {
      // Kuch browsers (jaise purana iOS Safari) mein download attribute kaam
      // nahi karta — is case mein image naye tab mein khol do taaki user
      // long-press karke "Save Image" kar sake.
      try {
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        statusMsg.className = 'status';
        statusMsg.textContent = 'Image naye tab mein khul gayi — usse dabakar (long-press) "Save Image" karo.';
      } catch (err2) {
        statusMsg.className = 'status';
        statusMsg.textContent = 'Download fail hua: ' + (err2 && err2.message ? err2.message : 'unknown error');
      }
    }
  }
}

generateBtn.addEventListener('click', generateVoucher);
downloadBtn.addEventListener('click', downloadVoucher);
</script>
</body>
</html>
